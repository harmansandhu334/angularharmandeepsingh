<div class="game-list">
  <h2>Games</h2>
  <button [routerLink]="['/games', 'add']">Add Game</button>


  <div *ngFor="let g of gamesList" class="game-item">
    <game-list-item [game]="g"></game-list-item>
    <button [routerLink]="['/games', g.id, 'edit']">Edit</button>
    <button (click)="delete(g.id)">Delete</button>




  </div>
</div>

<div *ngIf="error" class="error">{{ error }}</div>
