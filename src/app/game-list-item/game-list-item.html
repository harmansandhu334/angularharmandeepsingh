<div *ngIf="game" class="game-list" [appHoverHighlight]="'lightblue'">
  <h2>Game</h2>


  <p><strong>ID:</strong> {{ game.id }}</p>
  <p><strong>Title:</strong> {{ game.title| uppercase }}</p>
  <p><strong>Genre:</strong> {{ game.genre }}</p>
  <p><strong>Status:</strong> {{ game.inStock | stockStatus }}</p>

  <p><strong>Multiplayer:</strong> {{ game.multiplayer ? 'Yes' : 'No' }}</p>

  <p><strong>Price:</strong> {{ game.price | currency:'CAD':'symbol-narrow' }}</p>


  <p><strong>Release Date:</strong> {{ game.releaseDate | date }}</p>
  <img
    [ngSrc]="game.imgUrl"
    width="250"
    height="250"
    [alt]="game.title"
    priority
     />

</div>
