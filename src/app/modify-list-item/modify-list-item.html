<mat-card class="mat-form">
  <h2>{{ gameForm.get('id')?.value ? 'Update Game' : 'Add Game' }}</h2>

  <form [formGroup]="gameForm" (ngSubmit)="onSubmit()">

    <!-- ID -->
    <mat-form-field appearance="outline" class="form-field" disabled>
      <mat-label>ID</mat-label>
      <input
        matInput
        type="number"
        formControlName="id"
        appHighlightOnFocus="yellow"
      />
    </mat-form-field>

    <!-- Title -->
    <mat-form-field appearance="outline" class="form-field">
      <mat-label>Title</mat-label>
      <input
        matInput
        type="text"
        formControlName="title"
        appHighlightOnFocus="lightblue"
      />
    </mat-form-field>

    <!-- Genre -->
    <mat-form-field appearance="outline" class="form-field">
      <mat-label>Genre</mat-label>
      <input
        matInput
        type="text"
        formControlName="genre"
        appHighlightOnFocus="lightgreen"
      />
    </mat-form-field>

    <!-- In Stock & Multiplayer -->
    <div class="checkbox-row">
      <mat-checkbox formControlName="inStock">
        In Stock
      </mat-checkbox>

      <mat-checkbox formControlName="multiplayer">
        Multiplayer
      </mat-checkbox>
    </div>

    <!-- Image URL -->
    <mat-form-field appearance="outline" class="form-field">
      <mat-label>Image URL</mat-label>
      <input
        matInput
        type="text"
        formControlName="imgUrl"
      />
    </mat-form-field>

    <!-- Error message -->
    <div *ngIf="error" class="error">
      {{ error }}
    </div>

    <!-- Buttons -->
    <div class="button-group">
      <button
        mat-flat-button
        color="primary"
        type="submit"
        [disabled]="gameForm.invalid"
      >
        {{ gameForm.get('id')?.value ? 'Update Game' : 'Add Game' }}
      </button>

      <button
        mat-stroked-button
        color="warn"
        type="button"
        (click)="router.navigate(['/games'])"
      >
        Cancel
      </button>
    </div>
  </form>
</mat-card>
